spring:
  config:
    activate:
      on-profile: test
  docker:
    compose:
      enabled: false
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:11025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

notification:
  delivery:
    provider: ${NOTIFICATION_DELIVERY_PROVIDER:smtp}
    from: ${MAIL_FROM:no-reply@minitech.local}
