spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}

notification:
  delivery:
    provider: ${NOTIFICATION_DELIVERY_PROVIDER:external-api}
    from: ${MAIL_FROM:no-reply@minitech.example}
    external-api-url: ${NOTIFICATION_EXTERNAL_API_URL:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
