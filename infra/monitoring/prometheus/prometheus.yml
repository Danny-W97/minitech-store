global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: mini-order-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - product-service:8080
          - order-service:8080
          - inventory-service:8080
          - payment-service:8080
          - notification-service:8080
          - customer-service:8080
          - delivery-service:8080
          - promotion-service:8080
          - wishlist-service:8080
          - review-service:8080
          - recommendation-service:8080
          - chat-service:8080
          - returns-service:8080
          - billing-service:8080
        labels:
          platform: mini-order-platform
