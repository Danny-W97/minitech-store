    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_app -d billing_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  event-broker:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - event-broker-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000

volumes:
  inventory-db-data:
  product-db-data:
  order-db-data:
  payment-db-data:
  notification-db-data:
  customer-db-data:
  delivery-db-data:
  promotion-db-data:
  wishlist-db-data:
  review-db-data:
  recommendation-db-data:
  chat-db-data:
  returns-db-data:
