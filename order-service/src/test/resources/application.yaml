spring:
  profiles:
    active: test
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:orderdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

services:
  product:
    base-url: http://localhost:18081
  inventory:
    base-url: http://localhost:18083
  promotion:
    base-url: http://localhost:18089
