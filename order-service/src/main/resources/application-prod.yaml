spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

services:
  product:
    base-url: ${PRODUCT_SERVICE_URL}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL}
  promotion:
    base-url: ${PROMOTION_SERVICE_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
