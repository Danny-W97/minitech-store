spring:
  profiles:
    default: dev
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/order_db}
    username: ${DB_USERNAME:order_app}
    password: ${DB_PASSWORD:${ORDER_DB_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:18082}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [corr=%X{correlationId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: ${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
  health:
    livenessstate:
      enabled: ${MANAGEMENT_HEALTH_LIVENESS_ENABLED:true}
    readinessstate:
      enabled: ${MANAGEMENT_HEALTH_READINESS_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}

services:
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:18084}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:18081}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:18083}
  delivery:
    base-url: ${DELIVERY_SERVICE_URL:http://localhost:18088}
  promotion:
    base-url: ${PROMOTION_SERVICE_URL:http://localhost:18089}

order:
  saga:
    processing-lease-ms: ${ORDER_SAGA_PROCESSING_LEASE_MS:120000}
    recovery-enabled: ${ORDER_SAGA_RECOVERY_ENABLED:true}
    recovery-fixed-delay-ms: ${ORDER_SAGA_RECOVERY_FIXED_DELAY_MS:5000}
    reconciliation-fixed-delay-ms: ${ORDER_SAGA_RECONCILIATION_FIXED_DELAY_MS:30000}
    reconciliation-batch-size: ${ORDER_SAGA_RECONCILIATION_BATCH_SIZE:100}
    retry:
      initial-backoff-ms: ${ORDER_SAGA_RETRY_INITIAL_BACKOFF_MS:1000}
      max-backoff-ms: ${ORDER_SAGA_RETRY_MAX_BACKOFF_MS:60000}

resilience:
  http:
    request-budget-ms: ${RESILIENCE_HTTP_REQUEST_BUDGET_MS:15000}
    connect-timeout-ms: ${RESILIENCE_HTTP_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${RESILIENCE_HTTP_READ_TIMEOUT_MS:3000}
  retry:
    max-attempts: ${RESILIENCE_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${RESILIENCE_RETRY_INITIAL_BACKOFF_MS:200}
    backoff-multiplier: ${RESILIENCE_RETRY_BACKOFF_MULTIPLIER:2.0}
  circuit-breaker:
    sliding-window-size: ${RESILIENCE_CB_SLIDING_WINDOW_SIZE:20}
    minimum-number-of-calls: ${RESILIENCE_CB_MINIMUM_NUMBER_OF_CALLS:5}
    failure-rate-threshold: ${RESILIENCE_CB_FAILURE_RATE_THRESHOLD:50}
    wait-duration-open-seconds: ${RESILIENCE_CB_WAIT_DURATION_OPEN_SECONDS:10}
    half-open-permitted-calls: ${RESILIENCE_CB_HALF_OPEN_PERMITTED_CALLS:2}
  bulkhead:
    max-concurrent-calls: ${RESILIENCE_BULKHEAD_MAX_CONCURRENT_CALLS:50}
    max-wait-duration-ms: ${RESILIENCE_BULKHEAD_MAX_WAIT_DURATION_MS:0}

order.coupons.hold-ttl-seconds: ${COUPON_RESERVATION_TTL_SECONDS:2400}
order.coupons.expiry-enabled: ${COUPON_EXPIRY_ENABLED:true}
order.coupons.expiry-delay-ms: ${COUPON_EXPIRY_DELAY_MS:5000}

# Local storage gates readiness; dependency outages must not trigger JVM restarts.
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: readinessState,db
