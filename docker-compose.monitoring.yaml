name: mini-order-platform-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: mini-order-platform-prometheus
    ports:
      - "127.0.0.1:19090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - app-network
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: mini-order-platform-grafana
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin123}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - default
      - app-network
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
  app-network:
    name: miniorderplatform_default
    external: true
