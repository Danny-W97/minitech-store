spring:
  profiles:
    active: test
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:paymentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

  data:
    redis:
      url: redis://127.0.0.1:16379

services:
  order:
    base-url: http://localhost:18082
  inventory:
    base-url: http://localhost:18083

payment:
  provider: simulation
  inventory-confirm-attempts: 3
  inventory-confirm-backoff-ms: 1

outbox:
  publisher:
    fixed-delay-ms: 60000

messaging:
  payment-stream: payment-events-test

outbox.publisher.enabled: false
payment.follow-ups.enabled: false
