spring:
  profiles:
    default: dev
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15435/payment_db}
    username: ${DB_USERNAME:payment_app}
    password: ${DB_PASSWORD:${PAYMENT_DB_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:16379}

server:
  port: ${SERVER_PORT:18084}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [corr=%X{correlationId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: ${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
  health:
    livenessstate:
      enabled: ${MANAGEMENT_HEALTH_LIVENESS_ENABLED:true}
    readinessstate:
      enabled: ${MANAGEMENT_HEALTH_READINESS_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}

services:
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:18082}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:18083}
  promotion:
    base-url: ${PROMOTION_SERVICE_URL:http://localhost:18089}
  delivery:
    base-url: ${DELIVERY_SERVICE_URL:http://localhost:18088}
  billing:
    base-url: ${BILLING_SERVICE_URL:http://localhost:18095}

resilience:
  http:
    request-budget-ms: ${RESILIENCE_HTTP_REQUEST_BUDGET_MS:15000}
    connect-timeout-ms: ${RESILIENCE_HTTP_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${RESILIENCE_HTTP_READ_TIMEOUT_MS:3000}
  retry:
    max-attempts: ${RESILIENCE_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${RESILIENCE_RETRY_INITIAL_BACKOFF_MS:200}
    backoff-multiplier: ${RESILIENCE_RETRY_BACKOFF_MULTIPLIER:2.0}
  circuit-breaker:
    sliding-window-size: ${RESILIENCE_CB_SLIDING_WINDOW_SIZE:20}
    minimum-number-of-calls: ${RESILIENCE_CB_MINIMUM_NUMBER_OF_CALLS:5}
    failure-rate-threshold: ${RESILIENCE_CB_FAILURE_RATE_THRESHOLD:50}
    wait-duration-open-seconds: ${RESILIENCE_CB_WAIT_DURATION_OPEN_SECONDS:10}
    half-open-permitted-calls: ${RESILIENCE_CB_HALF_OPEN_PERMITTED_CALLS:2}
  bulkhead:
    max-concurrent-calls: ${RESILIENCE_BULKHEAD_MAX_CONCURRENT_CALLS:50}
    max-wait-duration-ms: ${RESILIENCE_BULKHEAD_MAX_WAIT_DURATION_MS:0}

payment:
  follow-ups:
    enabled: ${PAYMENT_FOLLOW_UPS_ENABLED:true}
    fixed-delay-ms: ${PAYMENT_FOLLOW_UPS_FIXED_DELAY_MS:1000}
    lease-ms: ${PAYMENT_FOLLOW_UPS_LEASE_MS:45000}
    max-attempts: ${PAYMENT_FOLLOW_UPS_MAX_ATTEMPTS:20}
  concurrent-wait-ms: ${PAYMENT_CONCURRENT_WAIT_MS:5000}
  processing-lease-ms: ${PAYMENT_PROCESSING_LEASE_MS:120000}
  provider: ${PAYMENT_PROVIDER:disabled}
  stripe:
    recovery-enabled: ${STRIPE_RECOVERY_ENABLED:true}
    recovery-delay-ms: ${STRIPE_RECOVERY_DELAY_MS:5000}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    return-base-url: ${PAYMENT_RETURN_BASE_URL:}
    api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
    signature-tolerance-seconds: ${STRIPE_SIGNATURE_TOLERANCE_SECONDS:300}
  inventory-confirm-attempts: ${PAYMENT_INVENTORY_CONFIRM_ATTEMPTS:3}
  inventory-confirm-backoff-ms: ${PAYMENT_INVENTORY_CONFIRM_BACKOFF_MS:250}

outbox:
  retention:
    mode: ${PAYMENT_OUTBOX_RETENTION_MODE:observe}
    retention: ${PAYMENT_OUTBOX_RETENTION_AGE:30d}
    batch-size: ${PAYMENT_OUTBOX_RETENTION_BATCH_SIZE:500}
    max-batches: ${PAYMENT_OUTBOX_RETENTION_MAX_BATCHES:4}
    interval-ms: ${PAYMENT_OUTBOX_RETENTION_INTERVAL_MS:600000}
    initial-delay-ms: ${PAYMENT_OUTBOX_RETENTION_INITIAL_DELAY_MS:60000}
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    lease-ms: ${OUTBOX_PUBLISHER_LEASE_MS:30000}
    fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}

messaging:
  payment-stream: ${PAYMENT_EVENT_STREAM:payment-events}

# Bound broker calls independently of request/worker budgets.
spring.data.redis.connect-timeout: ${EVENT_REDIS_CONNECT_TIMEOUT:1000ms}
spring.data.redis.timeout: ${EVENT_REDIS_TIMEOUT:1000ms}
spring.task.scheduling.pool.size: 4

# Local storage gates readiness; dependency outages must not trigger JVM restarts.
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: readinessState,db
