spring:
  profiles:
    default: dev
  application:
    name: api-gateway
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:16379}
      connect-timeout: ${GATEWAY_REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${GATEWAY_REDIS_TIMEOUT:500ms}

server:
  port: ${SERVER_PORT:18080}
  forward-headers-strategy: none

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    urls-primary-name: "🌐 00. API Gateway (Publiczne trasy proxy)"
    urls:
      - name: "🌐 00. API Gateway (Publiczne trasy proxy)"
        url: /v3/api-docs
      - name: "👤 01. Customer Service (Użytkownicy, Auth & Sesje)"
        url: /v3/api-docs/customer
      - name: "📦 02. Product Service (Katalog produktów)"
        url: /v3/api-docs/product
      - name: "🛒 03. Order Service (Zamówienia & Koszyk)"
        url: /v3/api-docs/order
      - name: "📊 04. Inventory Service (Stany magazynowe)"
        url: /v3/api-docs/inventory
      - name: "💳 05. Payment Service (Płatności & Transakcje)"
        url: /v3/api-docs/payment
      - name: "🚚 06. Delivery Service (Dostawy & Kurierzy)"
        url: /v3/api-docs/delivery
      - name: "🏷️ 07. Promotion Service (Promocje & Rabaty)"
        url: /v3/api-docs/promotion
      - name: "⭐ 08. Review Service (Opinie & Oceny)"
        url: /v3/api-docs/review
      - name: "❤️ 09. Wishlist Service (Listy życzeń)"
        url: /v3/api-docs/wishlist
      - name: "🎯 10. Recommendation Service (Rekomendacje AI/ML)"
        url: /v3/api-docs/recommendation
      - name: "💬 11. Chat Service (Czat z obsługą klienta)"
        url: /v3/api-docs/chat
      - name: "🔄 12. Returns Service (Zwroty & Reklamacje)"
        url: /v3/api-docs/returns
      - name: "🧾 13. Billing Service (Faktury & Rozliczenia)"
        url: /v3/api-docs/billing
      - name: "🔔 14. Notification Service (Powiadomienia & E-mail)"
        url: /v3/api-docs/notification

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [corr=%X{correlationId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: ${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
  health:
    livenessstate:
      enabled: ${MANAGEMENT_HEALTH_LIVENESS_ENABLED:true}
    readinessstate:
      enabled: ${MANAGEMENT_HEALTH_READINESS_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}

services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:18081}
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:18082}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:18083}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:18084}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:18086}
  customer:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:18087}
  delivery:
    base-url: ${DELIVERY_SERVICE_URL:http://localhost:18088}
  promotion:
    base-url: ${PROMOTION_SERVICE_URL:http://localhost:18089}
  wishlist:
    base-url: ${WISHLIST_SERVICE_URL:http://localhost:18090}
  review:
    base-url: ${REVIEW_SERVICE_URL:http://localhost:18091}
  recommendation:
    base-url: ${RECOMMENDATION_SERVICE_URL:http://localhost:18092}
  chat:
    base-url: ${CHAT_SERVICE_URL:http://localhost:18093}
  returns:
    base-url: ${RETURNS_SERVICE_URL:http://localhost:18094}
  billing:
    base-url: ${BILLING_SERVICE_URL:http://localhost:18095}

frontend:
  allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://127.0.0.1:18070,http://localhost:18070}

resilience:
  http:
    request-budget-ms: ${RESILIENCE_HTTP_REQUEST_BUDGET_MS:15000}
    connect-timeout-ms: ${RESILIENCE_HTTP_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${GATEWAY_HTTP_READ_TIMEOUT_MS:${RESILIENCE_HTTP_READ_TIMEOUT_MS:15000}}
  retry:
    max-attempts: ${RESILIENCE_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${RESILIENCE_RETRY_INITIAL_BACKOFF_MS:200}
    backoff-multiplier: ${RESILIENCE_RETRY_BACKOFF_MULTIPLIER:2.0}
  circuit-breaker:
    sliding-window-size: ${RESILIENCE_CB_SLIDING_WINDOW_SIZE:20}
    minimum-number-of-calls: ${RESILIENCE_CB_MINIMUM_NUMBER_OF_CALLS:5}
    failure-rate-threshold: ${RESILIENCE_CB_FAILURE_RATE_THRESHOLD:50}
    wait-duration-open-seconds: ${RESILIENCE_CB_WAIT_DURATION_OPEN_SECONDS:10}
    half-open-permitted-calls: ${RESILIENCE_CB_HALF_OPEN_PERMITTED_CALLS:2}
  bulkhead:
    max-concurrent-calls: ${RESILIENCE_BULKHEAD_MAX_CONCURRENT_CALLS:50}
    max-wait-duration-ms: ${RESILIENCE_BULKHEAD_MAX_WAIT_DURATION_MS:0}

gateway:
  export:
    max-concurrent: ${GATEWAY_EXPORT_MAX_CONCURRENT:2}
    connect-timeout-ms: ${GATEWAY_EXPORT_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${GATEWAY_EXPORT_READ_TIMEOUT_MS:30000}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    requests-per-window: ${GATEWAY_RATE_LIMIT_REQUESTS_PER_WINDOW:120}
    window-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}
    fail-open: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:true}
    trusted-proxy-cidrs: ${GATEWAY_TRUSTED_PROXY_CIDRS:}

# Local storage gates readiness; dependency outages must not trigger JVM restarts.
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: readinessState
