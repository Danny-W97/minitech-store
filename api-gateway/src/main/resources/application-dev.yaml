spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: false

services:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:18081}
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:18082}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:18083}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:18084}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:18086}
  delivery:
    base-url: ${DELIVERY_SERVICE_URL:http://localhost:18088}
  promotion:
    base-url: ${PROMOTION_SERVICE_URL:http://localhost:18089}
  wishlist:
    base-url: ${WISHLIST_SERVICE_URL:http://localhost:18090}
  review:
    base-url: ${REVIEW_SERVICE_URL:http://localhost:18091}
  recommendation:
    base-url: ${RECOMMENDATION_SERVICE_URL:http://localhost:18092}
