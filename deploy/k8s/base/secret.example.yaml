# Do not commit a real Secret. Create it in the cluster with your secret manager
# or copy this file to secret.yaml outside version control and replace values.
apiVersion: v1
kind: Secret
metadata:
  name: minitech-store-secrets
  namespace: minitech-store
type: Opaque
stringData:
  PRODUCT_DB_PASSWORD: replace-me
  ORDER_DB_PASSWORD: replace-me
  INVENTORY_DB_PASSWORD: replace-me
  PAYMENT_DB_PASSWORD: replace-me
  NOTIFICATION_DB_PASSWORD: replace-me
  CUSTOMER_DB_PASSWORD: replace-me
  DELIVERY_DB_PASSWORD: replace-me
  PROMOTION_DB_PASSWORD: replace-me
  WISHLIST_DB_PASSWORD: replace-me
  REVIEW_DB_PASSWORD: replace-me
  RECOMMENDATION_DB_PASSWORD: replace-me
  CHAT_DB_PASSWORD: replace-me
  RETURNS_DB_PASSWORD: replace-me
  BILLING_DB_PASSWORD: replace-me
  CUSTOMER_JWT_SECRET: replace-with-a-long-random-secret
  CUSTOMER_JWT_ACTIVE_KID: replace-with-kid-from-control-center
  CUSTOMER_JWT_PRIVATE_KEY_BASE64: replace-with-base64-pkcs8-rsa-private-key
  CUSTOMER_JWT_PUBLIC_KEYS_JSON: '{"replace-with-kid":"replace-with-base64-x509-rsa-public-key"}'
  CUSTOMER_MFA_ENCRYPTION_KEY_BASE64: replace-with-dedicated-32-byte-base64-key
  CUSTOMER_MFA_ACTIVE_KID: mfa-v1
  CUSTOMER_MFA_PREVIOUS_KEYS_JSON: '{}'
  CUSTOMER_MFA_LEGACY_KEY_BASE64: ''
  MAIL_USERNAME: replace-me-if-required
  MAIL_PASSWORD: replace-me-if-required

  # Generate random credentials using scripts/security/credentials.py in a private dotenv file.
  PLATFORM_BILLING_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_CHAT_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_CUSTOMER_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_DELIVERY_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_INVENTORY_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_NOTIFICATION_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_ORDER_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_PAYMENT_SERVICE_TOKEN: replace-with-generated-32-byte-token
  STRIPE_SECRET_KEY: replace-with-mode-matched-stripe-secret-key
  STRIPE_WEBHOOK_SECRET: replace-with-stripe-webhook-signing-secret
  PLATFORM_PRODUCT_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_PROMOTION_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_RECOMMENDATION_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_RETURNS_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_REVIEW_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_WISHLIST_SERVICE_TOKEN: replace-with-generated-32-byte-token
  PLATFORM_OPERATOR_TOKEN: replace-with-generated-operator-token
  PLATFORM_SERVICE_CREDENTIALS_JSON: replace-with-generated-registry-only-in-customer-service
