# Optional example. Install the OpenBao Secrets Store CSI provider first.
# Keep this file outside the default kustomization until the provider and
# secret paths are configured for the target cluster.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: minitech-store-secrets
  namespace: minitech-store
spec:
  provider: openbao
  secretObjects:
    - secretName: minitech-store-secrets
      type: Opaque
      data:
        - objectName: CUSTOMER_MFA_ENCRYPTION_KEY_BASE64
          key: CUSTOMER_MFA_ENCRYPTION_KEY_BASE64
        - objectName: CUSTOMER_JWT_ACTIVE_KID
          key: CUSTOMER_JWT_ACTIVE_KID
        - objectName: CUSTOMER_JWT_PRIVATE_KEY_BASE64
          key: CUSTOMER_JWT_PRIVATE_KEY_BASE64
        - objectName: CUSTOMER_JWT_PUBLIC_KEYS_JSON
          key: CUSTOMER_JWT_PUBLIC_KEYS_JSON
  parameters:
    roleName: customer-service
    objects: |
      - objectName: "CUSTOMER_MFA_ENCRYPTION_KEY_BASE64"
        secretPath: "secret/data/mini-order-platform/prod/customer-service"
        secretKey: "CUSTOMER_MFA_ENCRYPTION_KEY_BASE64"
      - objectName: "CUSTOMER_JWT_ACTIVE_KID"
        secretPath: "secret/data/mini-order-platform/prod/customer-service"
        secretKey: "CUSTOMER_JWT_ACTIVE_KID"
      - objectName: "CUSTOMER_JWT_PRIVATE_KEY_BASE64"
        secretPath: "secret/data/mini-order-platform/prod/customer-service"
        secretKey: "CUSTOMER_JWT_PRIVATE_KEY_BASE64"
      - objectName: "CUSTOMER_JWT_PUBLIC_KEYS_JSON"
        secretPath: "secret/data/mini-order-platform/prod/customer-service"
        secretKey: "CUSTOMER_JWT_PUBLIC_KEYS_JSON"
