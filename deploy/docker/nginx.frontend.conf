server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Static text only. API responses and photos keep separate policies.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        gzip off;
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Existing ?v= values are manual versions, so they must not receive immutable caching.
    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        error_page 404 = @missing_asset;
    }

    location @missing_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location = /order-detail.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
