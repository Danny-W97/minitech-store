# Shared HTTP limits apply to every JVM; Gateway overrides the downstream idle limit.
x-http-environment: &http-environment
  PRIVACY_RESTORE_JOURNAL_PUBLIC_KEY_BASE64: ${PRIVACY_RESTORE_JOURNAL_PUBLIC_KEY_BASE64:-}
  PRIVACY_RESTORE_JOURNAL_LEDGER_ID: ${PRIVACY_RESTORE_JOURNAL_LEDGER_ID:-}
  RESILIENCE_HTTP_CONNECT_TIMEOUT_MS: ${RESILIENCE_HTTP_CONNECT_TIMEOUT_MS:-1000}
  RESILIENCE_HTTP_READ_TIMEOUT_MS: ${RESILIENCE_HTTP_READ_TIMEOUT_MS:-3000}
  RESILIENCE_HTTP_REQUEST_BUDGET_MS: ${RESILIENCE_HTTP_REQUEST_BUDGET_MS:-15000}

services:
  product-service:
    image: mini-order-platform/product-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_MODULE: product-service
    pull_policy: build
    environment:
      <<: *http-environment
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_PRODUCT_SERVICE_TOKEN:?PLATFORM_PRODUCT_SERVICE_TOKEN is required}
      PLATFORM_AUTH_URL: http://customer-service:8080
      PLATFORM_ORDER_URL: http://order-service:8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://product-db:5432/product_db
      DB_USERNAME: product_app
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD is required}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD is required}
      PROMOTION_SERVICE_URL: http://promotion-service:8080
      CATALOG_LAYOUT_TTL_MS: ${CATALOG_LAYOUT_TTL_MS:-30000}
      CATALOG_LAYOUT_MAX_PRODUCTS: ${CATALOG_LAYOUT_MAX_PRODUCTS:-10000}
      REDIS_URL: redis://event-broker:6379
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      product-db:
        condition: service_healthy

  order-service:
    image: mini-order-platform/order-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_MODULE: order-service
    pull_policy: build
    environment:
      <<: *http-environment
      ORDER_SAGA_PROCESSING_LEASE_MS: ${ORDER_SAGA_PROCESSING_LEASE_MS:-120000}
      ORDER_SAGA_RECOVERY_ENABLED: ${ORDER_SAGA_RECOVERY_ENABLED:-true}
      COUPON_RESERVATION_TTL_SECONDS: ${COUPON_RESERVATION_TTL_SECONDS:-2400}
      COUPON_EXPIRY_ENABLED: ${COUPON_EXPIRY_ENABLED:-true}
      COUPON_EXPIRY_DELAY_MS: ${COUPON_EXPIRY_DELAY_MS:-5000}
      ORDER_SAGA_RECONCILIATION_FIXED_DELAY_MS: ${ORDER_SAGA_RECONCILIATION_FIXED_DELAY_MS:-30000}
      ORDER_SAGA_RECONCILIATION_BATCH_SIZE: ${ORDER_SAGA_RECONCILIATION_BATCH_SIZE:-100}
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_ORDER_SERVICE_TOKEN:?PLATFORM_ORDER_SERVICE_TOKEN is required}
      PLATFORM_AUTH_URL: http://customer-service:8080
      PLATFORM_ORDER_URL: http://order-service:8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USERNAME: order_app
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
      PRODUCT_SERVICE_URL: http://product-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      DELIVERY_SERVICE_URL: http://delivery-service:8080
      PROMOTION_SERVICE_URL: http://promotion-service:8080
      RETURNS_SERVICE_URL: http://returns-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      REDIS_URL: redis://event-broker:6379
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      order-db:
        condition: service_healthy
      event-broker:
        condition: service_healthy

  inventory-service:
    image: mini-order-platform/inventory-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_MODULE: inventory-service
    pull_policy: build
    environment:
      <<: *http-environment
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_INVENTORY_SERVICE_TOKEN:?PLATFORM_INVENTORY_SERVICE_TOKEN is required}
      PLATFORM_AUTH_URL: http://customer-service:8080
