services:
  product-service:
    image: mini-order-platform/product-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_MODULE: product-service
    pull_policy: build
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://product-db:5432/product_db
      DB_USERNAME: product_app
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD is required}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD is required}
      REDIS_URL: redis://event-broker:6379
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      product-db:
        condition: service_healthy

  order-service:
