  payment-service:
    image: mini-order-platform/payment-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_MODULE: payment-service
    pull_policy: build
    environment:
      PAYMENT_OUTBOX_RETENTION_MODE: ${PAYMENT_OUTBOX_RETENTION_MODE:-observe}
      PAYMENT_OUTBOX_RETENTION_AGE: ${PAYMENT_OUTBOX_RETENTION_AGE:-30d}
      PAYMENT_OUTBOX_RETENTION_BATCH_SIZE: ${PAYMENT_OUTBOX_RETENTION_BATCH_SIZE:-500}
      PAYMENT_OUTBOX_RETENTION_MAX_BATCHES: ${PAYMENT_OUTBOX_RETENTION_MAX_BATCHES:-4}
      PAYMENT_OUTBOX_RETENTION_INTERVAL_MS: ${PAYMENT_OUTBOX_RETENTION_INTERVAL_MS:-600000}
      PAYMENT_OUTBOX_RETENTION_INITIAL_DELAY_MS: ${PAYMENT_OUTBOX_RETENTION_INITIAL_DELAY_MS:-60000}
      <<: *http-environment
      PAYMENT_PROCESSING_LEASE_MS: ${PAYMENT_PROCESSING_LEASE_MS:-120000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulation}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMENT_RETURN_BASE_URL: ${PAYMENT_RETURN_BASE_URL:-http://127.0.0.1:18070/index.html}
      STRIPE_API_BASE_URL: ${STRIPE_API_BASE_URL:-https://api.stripe.com}
      STRIPE_SIGNATURE_TOLERANCE_SECONDS: ${STRIPE_SIGNATURE_TOLERANCE_SECONDS:-300}
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      OUTBOX_PUBLISHER_LEASE_MS: ${OUTBOX_PUBLISHER_LEASE_MS:-30000}
      OUTBOX_PUBLISHER_FIXED_DELAY_MS: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:-5000}
      EVENT_CONSUMER_CLAIM_IDLE_MS: ${EVENT_CONSUMER_CLAIM_IDLE_MS:-60000}
      PAYMENT_STREAM_RETENTION_AGE_MS: ${PAYMENT_STREAM_RETENTION_AGE_MS:-604800000}
      PAYMENT_STREAM_REQUIRED_GROUPS: ${PAYMENT_STREAM_REQUIRED_GROUPS:-notification-service,billing-service}
      EVENT_REDIS_CONNECT_TIMEOUT: ${EVENT_REDIS_CONNECT_TIMEOUT:-1000ms}
      EVENT_REDIS_TIMEOUT: ${EVENT_REDIS_TIMEOUT:-1000ms}
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_PAYMENT_SERVICE_TOKEN:?PLATFORM_PAYMENT_SERVICE_TOKEN is required}
      PLATFORM_AUTH_URL: http://customer-service:8080
      PLATFORM_ORDER_URL: http://order-service:8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      DB_USERNAME: payment_app
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD is required}
      ORDER_SERVICE_URL: http://order-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      PROMOTION_SERVICE_URL: http://promotion-service:8080
      DELIVERY_SERVICE_URL: http://delivery-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      REDIS_URL: redis://event-broker:6379
      MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
    ports:
