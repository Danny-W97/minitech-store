spring:
  profiles:
    default: dev
  application:
    name: chat-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15443/chat_db}
    username: ${DB_USERNAME:chat_app}
    password: ${DB_PASSWORD:${CHAT_DB_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:18093}

services:
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:18086}

chat:
  support-email: ${CHAT_SUPPORT_EMAIL:support@minitech.local}

resilience:
  http:
    connect-timeout-ms: ${RESILIENCE_HTTP_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${RESILIENCE_HTTP_READ_TIMEOUT_MS:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [corr=%X{correlationId}] %logger{36} - %msg%n"

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health:
    show-details: never
    probes.enabled: ${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
  health:
    livenessstate.enabled: ${MANAGEMENT_HEALTH_LIVENESS_ENABLED:true}
    readinessstate.enabled: ${MANAGEMENT_HEALTH_READINESS_ENABLED:true}
  metrics.tags.application: ${spring.application.name}

chat.outbox:
  enabled: ${CHAT_OUTBOX_ENABLED:true}
  fixed-delay-ms: ${CHAT_OUTBOX_FIXED_DELAY_MS:1000}
  lease-ms: ${CHAT_OUTBOX_LEASE_MS:30000}
  max-attempts: ${CHAT_OUTBOX_MAX_ATTEMPTS:20}
spring.task.scheduling.pool.size: 2

# Local storage gates readiness; dependency outages must not trigger JVM restarts.
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: readinessState,db
