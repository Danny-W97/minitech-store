spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  profiles:
    default: dev
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15434/inventory_db}
    username: ${DB_USERNAME:inventory_app}
    password: ${DB_PASSWORD:${INVENTORY_DB_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:18083}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [corr=%X{correlationId}] %logger{36} - %msg%n"

inventory:
  reservation:
    ttl-seconds: ${INVENTORY_RESERVATION_TTL_SECONDS:900}
    cleanup-fixed-delay-ms: ${INVENTORY_RESERVATION_CLEANUP_FIXED_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: ${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
  health:
    livenessstate:
      enabled: ${MANAGEMENT_HEALTH_LIVENESS_ENABLED:true}
    readinessstate:
      enabled: ${MANAGEMENT_HEALTH_READINESS_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}

# Local storage gates readiness; dependency outages must not trigger JVM restarts.
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: readinessState,db
