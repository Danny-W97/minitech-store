name: Debug Full API and Business E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minitech-store-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-api-business-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Playwright test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Full System E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Install locked Python QA dependencies
        run: |
          python3 -m venv --system-site-packages gitIgnoreOwn/qa-venv
          gitIgnoreOwn/qa-venv/bin/python -m pip install -r scripts/qa/requirements.txt
          echo "$PWD/gitIgnoreOwn/qa-venv/bin" >> "$GITHUB_PATH"

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package services without running tests
        run: ./mvnw --batch-mode -DskipTests package

      - name: Full API and business E2E
        run: bash scripts/qa/ci-e2e.sh

      - name: Print service logs on failure
        if: failure()
        run: |
          for log in gitIgnoreOwn/runtime/ci-*.log; do
            if [ -f "$log" ]; then
              echo "==================== $log (last 80 lines) ===================="
              tail -n 80 "$log"
            fi
          done

      - name: Upload OWASP ZAP report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-ci-e2e-zap-report
          path: gitIgnoreOwn/runtime/zap/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-ci-e2e-playwright-report
          path: gitIgnoreOwn/runtime/playwright/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload service logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-ci-e2e-ci-logs
          path: |
            gitIgnoreOwn/runtime/ci-*.log
            gitIgnoreOwn/runtime/qa/
          if-no-files-found: ignore
          retention-days: 1
