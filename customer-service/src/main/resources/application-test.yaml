spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:customerdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false

customer:
  verification:
    ttl-seconds: 300
    resend:
      min-interval-seconds: 60
      max-attempts: 3
      window-seconds: 3600
  auth:
    jwt-secret: c29tZS10ZXN0LWp3dC1zZWNyZXQta2V5LWxvbmcgZW5vdWdo
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
    refresh-cookie-name: MINITECH_TEST_REFRESH_TOKEN
    refresh-cookie-path: /
    refresh-cookie-secure: false
  password-reset:
    ttl-seconds: 900
  login-protection:
    max-failed-attempts: 5
    failure-window-seconds: 900
    lock-seconds: 900
